name: Build CapCheck APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CapCheck source
        run: |
          unzip CapCheck-Android-Source.zip
          test -f CapCheck/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: CapCheck
        run: gradle assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: CapCheck-APK
          path: CapCheck/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
